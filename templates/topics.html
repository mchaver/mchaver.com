<p>Posts grouped by topic. Each topic links to its full tag page.</p>

$for(topics)$
<section class="topic">
  <h2><a href="$topicUrl$">$topic$</a> <span class="topic-count">$count$</span></h2>
  <ul class="topic-posts">
    $for(posts)$
      <li><a href="$url$">$title$</a></li>
    $endfor$
  </ul>
</section>
$endfor$
