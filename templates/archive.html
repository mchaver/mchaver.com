<p>Every post, newest first. Search, or filter by topic and kind.</p>

<div class="archive-controls">
  <input id="q" class="search-input" type="search"
         placeholder="Search posts…" autofocus aria-label="Search posts">
  <select id="f-topic" class="archive-filter" aria-label="Filter by topic">
    <option value="">all topics</option>
  </select>
  <select id="f-kind" class="archive-filter" aria-label="Filter by kind">
    <option value="">all kinds</option>
    <option value="tutorial">tutorial</option>
    <option value="reference">reference</option>
    <option value="note">note</option>
  </select>
  <select id="f-sort" class="archive-filter" aria-label="Sort order">
    <option value="desc">newest first</option>
    <option value="asc">oldest first</option>
  </select>
</div>

<ul id="results" class="posts archive search-results"></ul>

<script>
  (function () {
    var idx   = [],
        q     = document.getElementById('q'),
        topic = document.getElementById('f-topic'),
        kind  = document.getElementById('f-kind'),
        sort  = document.getElementById('f-sort'),
        out   = document.getElementById('results');

    function esc(s) {
      return (s || '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // Populate the topic dropdown with the alphabetical union of all tags.
    function fillTopics() {
      var set = {};
      idx.forEach(function (p) {
        (p.tags || []).forEach(function (t) { set[t] = true; });
      });
      Object.keys(set).sort(function (a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
      }).forEach(function (t) {
        var o = document.createElement('option');
        o.value = t;
        o.textContent = t;
        topic.appendChild(o);
      });
    }

    function render() {
      var term     = q.value.trim().toLowerCase(),
          words    = term ? term.split(/\s+/) : [],
          wantTag  = topic.value,
          wantKind = kind.value,
          asc      = sort.value === 'asc';

      var hits = idx.filter(function (p) {
        if (wantKind && p.kind !== wantKind) return false;
        if (wantTag && (p.tags || []).indexOf(wantTag) < 0) return false;
        if (words.length) {
          var hay = (p.title + ' ' + (p.tags || []).join(' ') + ' ' +
                     p.kind + ' ' + p.text).toLowerCase();
          if (!words.every(function (w) { return hay.indexOf(w) >= 0; })) return false;
        }
        return true;
      });

      // idx arrives newest-first; reverse a copy for oldest-first.
      if (asc) hits = hits.slice().reverse();

      out.innerHTML = '';
      if (!hits.length) {
        out.innerHTML = '<li class="search-none">No matches.</li>';
        return;
      }
      hits.forEach(function (p) {
        var li = document.createElement('li');
        li.className = 'post archive-row';
        var tags = (p.tags || []).map(esc).join(', ');
        li.innerHTML =
          '<a class="post-link archive-title" href="' + esc(p.url) + '">' +
            esc(p.title) + '</a>' +
          '<div class="archive-meta">' +
            (p.kind ? '<span class="meta-type type-' + esc(p.kind) + '">' +
                      esc(p.kind) + '</span>' : '') +
            (p.state ? '<span class="meta-state state-' + esc(p.state) + '">' +
                       esc(p.state) + '</span>' : '') +
            (tags ? '<span class="meta-tags">' + tags + '</span>' : '') +
            '<span class="meta-date">' + esc(p.date) + '</span>' +
          '</div>';
        out.appendChild(li);
      });
    }

    q.addEventListener('input', render);
    topic.addEventListener('change', render);
    kind.addEventListener('change', render);
    sort.addEventListener('change', render);

    fetch('/search.json')
      .then(function (r) { return r.json(); })
      .then(function (d) { idx = d; fillTopics(); render(); });
  })();
</script>
