<p>All posts, most recently updated first.</p>

<ol class="posts archive">
  $for(posts)$
  <li class="archive-row">
    <a class="post-link archive-title" href="$url$">$title$</a>
    <div class="archive-meta">
      $if(kind)$<span class="meta-type type-$kind$">$kind$</span>$endif$
      <span class="meta-state state-$state$">$state$</span>
      $if(tags)$<span class="meta-tags">$tags$</span>$endif$
      <span class="meta-date">$lastdate$</span>
    </div>
  </li>
  $endfor$
</ol>
