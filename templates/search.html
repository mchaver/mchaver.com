<input id="q" class="search-input" type="search"
       placeholder="Search posts…" autofocus aria-label="Search posts">
<ul id="results" class="posts search-results"></ul>

<script>
  (function () {
    var idx = [],
        q   = document.getElementById('q'),
        out = document.getElementById('results');

    function esc(s) {
      return (s || '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function render() {
      var term = q.value.trim().toLowerCase();
      out.innerHTML = '';
      if (!term) return;
      var words = term.split(/\s+/);
      var hits = idx.filter(function (p) {
        var hay = (p.title + ' ' + (p.tags || []).join(' ') + ' ' +
                   p.kind + ' ' + p.text).toLowerCase();
        return words.every(function (w) { return hay.indexOf(w) >= 0; });
      }).slice(0, 50);

      if (!hits.length) {
        out.innerHTML = '<li class="search-none">No matches.</li>';
        return;
      }
      hits.forEach(function (p) {
        var li = document.createElement('li');
        li.className = 'post';
        li.innerHTML =
          '<a class="post-link" href="' + esc(p.url) + '">' + esc(p.title) + '</a>' +
          (p.kind ? ' <span class="kind kind-' + esc(p.kind) + '">' +
                    esc(p.kind) + '</span>' : '') +
          '<div class="post-date">' + esc(p.date) + '</div>';
        out.appendChild(li);
      });
    }

    q.addEventListener('input', render);
    fetch('/search.json')
      .then(function (r) { return r.json(); })
      .then(function (d) { idx = d; render(); });
  })();
</script>
