<ol class="posts">
  $for(posts)$
    <li class="post">
      <a class="post-link" href="$url$">$title$</a>
      $if(kind)$<span class="kind kind-$kind$">$kind$</span>$endif$
      <span>
        $if(tags)$
        $tags$
        $endif$
      </span>
      <div class="post-date">$date$</div>
    </li>
  $endfor$
</ol>
