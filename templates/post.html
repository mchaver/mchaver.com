$if(series)$
<nav class="series-nav">
  <div class="series-label">Series: $series$</div>
  <ol>
    $for(seriesPosts)$
      <li>$if(current)$<span class="current">$title$</span>$else$<a href="$url$">$title$</a>$endif$</li>
    $endfor$
  </ol>
</nav>
$endif$

<div class="info">
  $if(kind)$<span class="kind kind-$kind$">$kind$</span> $endif$$date$
</div>

<div>
  $if(tags)$
  $tags$
  $endif$
</div>

$body$

$if(hasRelated)$
<aside class="related">
  <h2>Related posts</h2>
  <ul>
    $for(related)$
      <li><a href="$url$">$title$</a></li>
    $endfor$
  </ul>
</aside>
$endif$
