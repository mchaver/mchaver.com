<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Set the theme before first paint to avoid a flash of the wrong colors.
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme', stored || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
    <title>mchaver - $title$</title>
    <link rel="stylesheet" href="/css/default.css" />
    <link rel="stylesheet" href="/css/syntax.css" />
    <link rel="alternate" type="application/rss+xml" title="mchaver.com" href="/rss.xml" />
  </head>
  <body>
    <div id="wrapper">
      <div id="header">
        <a href="/" id="main-link">mchaver</a>
        <span class="headerlinks">
          <a href="/">blog</a></li>
          <span> | </span>
          <a href="/topics.html">topics</a>
          <span> | </span>
          <a href="/archive.html">archive</a>
          <span> | </span>
          <a href="/projects.html">projects</a>
          <span> | </span>
          <a href="/about.html">about</a>
        </span>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      </div>
      
      <section>
        <article id="content">
          <h1>$title$</h1>
          $body$
        </article>
      </section>

      <div id="footer">
      </div>
    </div>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        var icon = function (t) { return t === 'dark' ? '☀︎' : '🌙'; };
        btn.textContent = icon(root.getAttribute('data-theme'));
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = icon(next);
        });
      })();
    </script>
  </body>
</html>
