      // Set the theme before first paint to avoid a flash of the wrong colors.
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme', stored || (prefersDark ? 'dark' : 'light'));
      })();
    </script>

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        var icon = function (t) { return t === 'dark' ? '☀︎' : '🌙'; };
        btn.textContent = icon(root.getAttribute('data-theme'));
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = icon(next);
        });
      })();
      // Cmd/Ctrl-K jumps to search.
      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          window.location.href = '/search.html';
        }
      });
